<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMS - Warehouse Management System</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var preset = localStorage.getItem('theme_preset');
          var presets = ['default', 'brutalist', 'soft-pop', 'tangerine'];
          if (preset && presets.indexOf(preset) >= 0) {
            root.setAttribute('data-theme-preset', preset);
          }
          var mode = localStorage.getItem('theme');
          if (mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else if (mode === 'light') {
            root.style.colorScheme = 'light';
          } else {
            root.style.colorScheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
